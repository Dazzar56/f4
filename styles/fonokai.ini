[style]
Name = Fonokai

# Тема far2l "default dark", перенесённая в f4 и окончательно адаптированная под мягкую палитру Monokai.

# Вещи, требующие доработок:
# 1. Кейбар привлекает слишком много внимания, хотя, наоборот, не должен отвлекать от пользовательских данных.
# Фон цифр там идеален, его не трогаем. А вот фон текста слишком привлекает внимание.
# Надо подобрать гармоничные теплые оттенки серого, чтобы кейбар хорошо читался, но в глаза не лез.
# 2. Cтрелка вниз справа при не активности контрола комбобокса - черная на тёмно-сером фоне, хотя должна быть светлая!

[farcolors]

# Panel
Panel.Box = foreground:#555753 | background:#2e3436
# Курсор панели теперь использует мягкий Monokai Cyan
Panel.Cursor = foreground:#2e3436 | background:#66d9ef
# В far2l курсор пассивной панели не выделяется отдельно.
Panel.Cursor.Inactive = foreground:#d3d7cf | background:#555753
# Выделенный файл под пассивным курсором (Monokai Pink)
Panel.Cursor.Inactive.Selected = foreground:#f92672 | background:#555753
Panel.Cursor.Selected = foreground:#f92672 | background:#66d9ef
# Сущность f4, слот пока никем не рисуется.
Panel.Dir = foreground:#66d9ef | background:#2e3436
# Быстрый поиск без совпадений
Panel.FastFindNoMatch = foreground:#ef2929 | background:#2e3436
Panel.Info.Selected = foreground:#f92672 | background:#66d9ef
Panel.Info.Total = foreground:#eeeeec | background:#2e3436
Panel.Scrollbar = foreground:#66d9ef | background:#2e3436
Panel.Scrollbar.Minimal = foreground:#eeeeec | background:#2e3436
Panel.Text = foreground:#66d9ef | background:#2e3436
Panel.Text.Highlight = foreground:#f92672 | background:#2e3436
Panel.Text.Info = foreground:#e6db74 | background:#2e3436
Panel.Text.Selected = foreground:#f92672 | background:#2e3436
Panel.Title = foreground:#d3d7cf | background:#2e3436
# Колонки панели подсвечены свежим Monokai Green
Panel.Title.Column = foreground:#a6e22e | background:#2e3436
Panel.Title.Selected = foreground:#2e3436 | background:#66d9ef

# Общий скроллбар (для диалогов на сером фоне)
Scrollbar = foreground:#2e3436 | background:#d3d7cf
Table.Box = foreground:#555753 | background:#d3d7cf

# Dialog
Dialog.Box = foreground:#555753 | background:#d3d7cf
Dialog.Box.Title = foreground:#2e3436 | background:#d3d7cf
Dialog.Box.Title.Highlight = foreground:#f92672 | background:#d3d7cf
Dialog.Button = foreground:#2e3436 | background:#d3d7cf
Dialog.Button.Highlight = foreground:#f92672 | background:#d3d7cf
Dialog.Button.Highlight.Selected = foreground:#f92672 | background:#66d9ef
Dialog.Button.Selected = foreground:#2e3436 | background:#66d9ef

# Combo (Выпадающее меню теперь глубокого темного цвета, контрастирует с полем ввода)
Dialog.Combo.Box = foreground:#555753 | background:#2e3436
Dialog.Combo.Highlight = foreground:#f92672 | background:#2e3436
Dialog.Combo.Highlight.Selected = foreground:#f92672 | background:#66d9ef
# Стрелка комбобокса — светлая, фон совпадает с фоном комбобокса, чтобы не было лишнего прямоугольника
Dialog.Combo.Scrollbar = foreground:#eeeeec | background:#2e3436
Dialog.Combo.Text = foreground:#eeeeec | background:#2e3436
Dialog.Combo.Text.Selected = foreground:#2e3436 | background:#66d9ef
Dialog.Combo.Title = foreground:#eeeeec | background:#2e3436

# Edit (Строка ввода - средний серый)
Dialog.Edit = foreground:#eeeeec | background:#555753
Dialog.Edit.Selected = foreground:#2e3436 | background:#66d9ef
Dialog.Edit.Unchanged = foreground:#2e3436 | background:#66d9ef
Dialog.Text = foreground:#2e3436 | background:#d3d7cf
Dialog.Text.Highlight = foreground:#f92672 | background:#d3d7cf

# Warning message
WarnDialog.Box = foreground:#d3d7cf | background:#cc0000
WarnDialog.Box.Title = foreground:#eeeeec | background:#cc0000
WarnDialog.Box.Title.Highlight = foreground:#e6db74 | background:#cc0000
WarnDialog.Button = foreground:#eeeeec | background:#cc0000
WarnDialog.Button.Highlight = foreground:#e6db74 | background:#cc0000
WarnDialog.Button.Highlight.Selected = foreground:#cc0000 | background:#d3d7cf
WarnDialog.Button.Selected = foreground:#2e3436 | background:#d3d7cf
WarnDialog.Edit = foreground:#2e3436 | background:#66d9ef
WarnDialog.Edit.Selected = foreground:#eeeeec | background:#555753
WarnDialog.Edit.Unchanged = foreground:#d3d7cf | background:#66d9ef
WarnDialog.Text = foreground:#eeeeec | background:#cc0000
WarnDialog.Text.Highlight = foreground:#e6db74 | background:#cc0000

# Menu
Menu.Box = foreground:#555753 | background:#d3d7cf
Menu.Highlight = foreground:#f92672 | background:#d3d7cf
Menu.Highlight.Selected = foreground:#f92672 | background:#66d9ef
Menu.Text = foreground:#2e3436 | background:#d3d7cf
Menu.Text.Selected = foreground:#2e3436 | background:#66d9ef
Menu.Title = foreground:#2e3436 | background:#d3d7cf

# Horizontal menu
HMenu.Highlight = foreground:#f92672 | background:#d3d7cf
HMenu.Highlight.Selected = foreground:#f92672 | background:#66d9ef
HMenu.Text = foreground:#2e3436 | background:#d3d7cf
HMenu.Text.Selected = foreground:#2e3436 | background:#66d9ef

# Key bar
Keybar.Num = foreground:#d3d7cf | background:#2e3436
# Фон текста затемнён на 25% относительно предыдущего тёплого серого, стал ещё спокойнее
Keybar.Text = foreground:#2e3436 | background:#686860

# Command line
CommandLine = foreground:#d3d7cf | background:#2e3436
CommandLine.Prefix = foreground:#d3d7cf | background:#2e3436
CommandLine.Prompt.Inactive = foreground:#555753 | background:#2e3436
CommandLine.Selected = foreground:#2e3436 | background:#d3d7cf
CommandLine.UserScreen = foreground:#d3d7cf | background:#2e3436

# Viewer
Viewer.Arrows = foreground:#e6db74 | background:#2e3436
Viewer.Scrollbar = foreground:#66d9ef | background:#2e3436
Viewer.Status = foreground:#2e3436 | background:#66d9ef
Viewer.Text = foreground:#eeeeec | background:#2e3436

# Editor
Editor.Scrollbar = foreground:#66d9ef | background:#2e3436
Editor.Status = foreground:#2e3436 | background:#66d9ef
Editor.Text = foreground:#eeeeec | background:#2e3436

# Help (Полностью переведён на благородную тёмную Monokai-гамму)
Help.Box = foreground:#555753 | background:#2e3436
Help.Box.Title = foreground:#e6db74 | background:#2e3436
Help.Text = foreground:#eeeeec | background:#2e3436
Help.Text.Highlight = foreground:#f92672 | background:#2e3436
Help.Topic = foreground:#66d9ef | background:#2e3436
Help.Topic.Selected = foreground:#2e3436 | background:#66d9ef