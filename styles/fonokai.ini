[style]
Name = Fonokai

# Тёплая, ламповая тема.
# Основные акценты: янтарный (#e6b450), тёмное дерево (#37322c),
# бумага (#dbd3c4). Исправлено: читаемость горячих клавиш, текст кейбара,
# Help теперь на янтарном фоне для максимальной заметности.

[farcolors]

# Panel
Panel.Box = foreground:#555753 | background:#37322c
Panel.Cursor = foreground:#1e1a16 | background:#e6b450
Panel.Cursor.Inactive = foreground:#d3d7cf | background:#555753
Panel.Cursor.Inactive.Selected = foreground:#ec6a2c | background:#555753
Panel.Cursor.Selected = foreground:#ec6a2c | background:#e6b450
Panel.Dir = foreground:#e6b450 | background:#37322c
Panel.FastFindNoMatch = foreground:#d04020 | background:#37322c
Panel.Info.Selected = foreground:#ec6a2c | background:#e6b450
Panel.Info.Total = foreground:#eeeeec | background:#37322c
Panel.Scrollbar = foreground:#e6b450 | background:#37322c
Panel.Scrollbar.Minimal = foreground:#eeeeec | background:#37322c
Panel.Text = foreground:#e6b450 | background:#37322c
Panel.Text.Highlight = foreground:#ec6a2c | background:#37322c
Panel.Text.Info = foreground:#e6cf70 | background:#37322c
Panel.Text.Selected = foreground:#ec6a2c | background:#37322c
Panel.Title = foreground:#d3d7cf | background:#37322c
Panel.Title.Column = foreground:#b7b040 | background:#37322c
Panel.Title.Selected = foreground:#37322c | background:#e6b450

# Общий скроллбар
Scrollbar = foreground:#37322c | background:#dbd3c4
Table.Box = foreground:#555753 | background:#dbd3c4

# Dialog
Dialog.Box = foreground:#555753 | background:#dbd3c4
Dialog.Box.Title = foreground:#2e2a24 | background:#dbd3c4
Dialog.Box.Title.Highlight = foreground:#a04020 | background:#dbd3c4
Dialog.Button = foreground:#2e2a24 | background:#dbd3c4
Dialog.Button.Highlight = foreground:#a04020 | background:#dbd3c4
Dialog.Button.Highlight.Selected = foreground:#a04020 | background:#e6b450
Dialog.Button.Selected = foreground:#2e2a24 | background:#e6b450

# Combo
Dialog.Combo.Box = foreground:#555753 | background:#37322c
Dialog.Combo.Highlight = foreground:#a04020 | background:#37322c
Dialog.Combo.Highlight.Selected = foreground:#a04020 | background:#e6b450
Dialog.Combo.Scrollbar = foreground:#dbd3c4 | background:#37322c
Dialog.Combo.Text = foreground:#eeeeec | background:#37322c
Dialog.Combo.Text.Selected = foreground:#2e2a24 | background:#e6b450
Dialog.Combo.Title = foreground:#eeeeec | background:#37322c

# Edit
Dialog.Edit = foreground:#eeeeec | background:#5b5950
Dialog.Edit.Selected = foreground:#2e2a24 | background:#e6b450
Dialog.Edit.Unchanged = foreground:#2e2a24 | background:#e6b450
Dialog.Text = foreground:#2e2a24 | background:#dbd3c4
Dialog.Text.Highlight = foreground:#a04020 | background:#dbd3c4

# Warning
WarnDialog.Box = foreground:#d3d7cf | background:#c44500
WarnDialog.Box.Title = foreground:#eeeeec | background:#c44500
WarnDialog.Box.Title.Highlight = foreground:#e6cf70 | background:#c44500
WarnDialog.Button = foreground:#eeeeec | background:#c44500
WarnDialog.Button.Highlight = foreground:#e6cf70 | background:#c44500
WarnDialog.Button.Highlight.Selected = foreground:#c44500 | background:#dbd3c4
WarnDialog.Button.Selected = foreground:#2e2a24 | background:#dbd3c4
WarnDialog.Edit = foreground:#2e2a24 | background:#e6b450
WarnDialog.Edit.Selected = foreground:#eeeeec | background:#5b5950
WarnDialog.Edit.Unchanged = foreground:#d3d7cf | background:#e6b450
WarnDialog.Text = foreground:#eeeeec | background:#c44500
WarnDialog.Text.Highlight = foreground:#e6cf70 | background:#c44500

# Menu (исправлены горячие клавиши: более тёмный контрастный цвет)
Menu.Box = foreground:#555753 | background:#dbd3c4
Menu.Highlight = foreground:#a04020 | background:#dbd3c4
Menu.Highlight.Selected = foreground:#a04020 | background:#e6b450
Menu.Text = foreground:#2e2a24 | background:#dbd3c4
Menu.Text.Selected = foreground:#2e2a24 | background:#e6b450
Menu.Title = foreground:#2e2a24 | background:#dbd3c4

# Horizontal menu
HMenu.Highlight = foreground:#a04020 | background:#dbd3c4
HMenu.Highlight.Selected = foreground:#a04020 | background:#e6b450
HMenu.Text = foreground:#2e2a24 | background:#dbd3c4
HMenu.Text.Selected = foreground:#2e2a24 | background:#e6b450

# Key bar (текст стал светлее для читаемости, но не кричит)
Keybar.Num = foreground:#d3d7cf | background:#37322c
Keybar.Text = foreground:#c4b8a8 | background:#6a6458

# Command line
CommandLine = foreground:#d3d7cf | background:#37322c
CommandLine.Prefix = foreground:#d3d7cf | background:#37322c
CommandLine.Prompt.Inactive = foreground:#555753 | background:#37322c
CommandLine.Selected = foreground:#2e2a24 | background:#dbd3c4
CommandLine.UserScreen = foreground:#d3d7cf | background:#37322c

# Viewer
Viewer.Arrows = foreground:#e6cf70 | background:#37322c
Viewer.Scrollbar = foreground:#e6b450 | background:#37322c
Viewer.Status = foreground:#2e2a24 | background:#e6b450
Viewer.Text = foreground:#eeeeec | background:#37322c

# Editor
Editor.Scrollbar = foreground:#e6b450 | background:#37322c
Editor.Status = foreground:#2e2a24 | background:#e6b450
Editor.Text = foreground:#eeeeec | background:#37322c

# Help (фон как у курсора панели — янтарный, максимальный контраст)
Help.Box = foreground:#1e1a16 | background:#e6b450
Help.Box.Title = foreground:#1e1a16 | background:#e6b450
Help.Text = foreground:#1e1a16 | background:#e6b450
Help.Text.Highlight = foreground:#a04020 | background:#e6b450
Help.Topic = foreground:#1e1a16 | background:#e6b450
Help.Topic.Selected = foreground:#e6b450 | background:#1e1a16