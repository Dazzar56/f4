name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin, freebsd]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: go.sum
    - name: Run Tests
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        echo "Running f4 core tests..."
        go test -tags nofakecgo -v ./...
        echo "Running vtui tests..."
        (cd libs/vtui && go test -tags nofakecgo -v ./...)
        echo "Running vtinput tests..."
        (cd libs/vtinput && go test -tags nofakecgo -v ./...)

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/plugins/dummy_internal
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Prepare flags for truly static binary on Linux
        LDFLAGS="-s -w"
        if [ "$GOOS" = "linux" ]; then LDFLAGS="$LDFLAGS -extldflags '-static'"; fi

        # Build core
        go build -tags nofakecgo -ldflags="$LDFLAGS" -o build/f4$EXT .

        # Build internal dummy plugin
        cd plugins/dummy_internal
        go build -tags nofakecgo -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT .

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r ../f4-${{ matrix.goos }}-${{ matrix.goarch }}.zip .)
        else
          # Создаем архив в корне, упаковывая содержимое build (без самой папки build)
          tar -czvf f4-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build .
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-${{ matrix.goos }}-${{ matrix.goarch }}
        path: f4-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  release:
    name: Create Official Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code (to get git info)
      uses: actions/checkout@v4

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: |
          Automated pre-release build of the latest `main` branch.

          **Commit:** `${{ env.SHORT_SHA }}`
          **Built on:** `${{ env.BUILD_TIME }}`
        prerelease: true
        files: artifacts/*