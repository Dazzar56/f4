name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: go.sum

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p build/plugins/dummy
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Build core
        go build -ldflags="-s -w" -o build/f4$EXT .

        # Build dummy plugin
        cd plugins/dummy
        go build -ldflags="-s -w" -o ../../build/plugins/dummy/f4-dummy-plugin$EXT .

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r ../f4-${{ matrix.goos }}-${{ matrix.goarch }}.zip .)
        else
          # Создаем архив в корне, упаковывая содержимое build (без самой папки build)
          tar -czvf f4-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build .
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-${{ matrix.goos }}-${{ matrix.goarch }}
        path: f4-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  release:
    name: Create Official Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: "Automated pre-release build of the latest main branch. Updated on ${{ github.event.head_commit.timestamp }}."
        prerelease: true
        files: artifacts/*