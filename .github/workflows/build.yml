name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache-dependency-path: go.sum

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p build/plugins/dummy
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Build core
        go build -ldflags="-s -w" -o build/f4$EXT .

        # Build dummy plugin
        cd plugins/dummy
        go build -ldflags="-s -w" -o ../../build/plugins/dummy/f4-dummy-plugin$EXT .

    - name: Package
      run: |
        cd build
        if [ "${{ matrix.goos }}" = "windows" ]; then
          zip -r f4-${{ matrix.goos }}-${{ matrix.goarch }}.zip .
        else
          tar -czvf f4-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz .
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/f4-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true